name: Live stores

# Read-only checks of the steps on real public stores (tests/live/), started by hand only: the
# stores belong to their owners, so they are never checked on every push. The runner loads one
# page per scenario and pauses between scenarios; nothing is added to a cart or sent to a store.
on:
  workflow_dispatch:
    inputs:
      store:
        description: 'One store of tests/live (its file name without .feature), or empty for every store'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  live:
    name: shopify-steps on real stores (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEADLESS: 'true'
      FORCE_COLOR: '1'
      STORE: ${{ inputs.store }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the read-only checks
        run: |
          if [ -n "$STORE" ] && ! printf '%s' "$STORE" | grep -Eq '^[a-z0-9.-]+$'; then
            echo "The store is a file name of tests/live without .feature, such as ugmonk.com." >&2
            exit 1
          fi
          npm run test:live -- $STORE

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-failure-screenshots
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore
