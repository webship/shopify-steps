name: Test

on:
  push:
    branches:
      - 2.0.x
  pull_request:
    branches:
      - 2.0.x
  workflow_dispatch:

permissions:
  contents: read

# The runs of a pull request share a group, so a newer push cancels the run
# it supersedes. Every other run (a push to 2.0.x, a run started by hand)
# gets a group of its own: it is never queued behind another run, and never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  demo:
    # The demo store of this repository, started with DDEV as the README starts it: the whole
    # suite twice (it leaves the store as it found it), then the assertions that must fail.
    name: shopify-steps on the demo store (DDEV)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HEADLESS: 'true'
      FORCE_COLOR: '1'
      DEMO_URL: http://shopify-steps-demo.ddev.site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the JSDoc examples and feature steps against the step regexes
        run: npm run test:examples

      - name: Check that a feature named on the command line runs alone
        run: npm run test:paths

      - name: Run cucumber-js dry-run (ambiguity / undefined step check)
        run: npx cucumber-js --dry-run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Start the demo store (DDEV)
        run: |
          cd demo-site
          ddev start

      - name: Wait for the demo store to answer
        run: |
          for i in $(seq 1 60); do
            curl -sf "$DEMO_URL/cart.js" > /dev/null && curl -sf "$DEMO_URL/products/canvas-tote" > /dev/null && exit 0
            sleep 2
          done
          echo "The demo store did not answer in time" >&2
          cd demo-site && ddev logs -s web | tail -40
          exit 1

      - name: Check the demo store is the one cucumber.js runs against by default
        run: |
          DEFAULT_URL="$(LAUNCH_URL= node -e "console.log(require('./cucumber.js').default.worldParameters.launchUrl)")"
          echo "Started: $DEMO_URL, default: $DEFAULT_URL"
          test "$DEMO_URL" = "$DEFAULT_URL"

      - name: Run the test suite
        run: npx cucumber-js

      - name: Run the test suite again (it leaves the store as it found it)
        run: npx cucumber-js

      - name: Run the assertions that must fail
        run: npm run test:must-fail

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-demo
          path: tests/reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-demo
          path: |
            screenshots/
            videos/
          retention-days: 14
          if-no-files-found: ignore

  server:
    # The same demo store without a container: the stand-in's own server, as the README's second
    # way starts it (npm run demo:serve), and the whole suite against it.
    name: shopify-steps on the demo store (its own server, no container)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEADLESS: 'true'
      FORCE_COLOR: '1'
      LAUNCH_URL: http://127.0.0.1:8080
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start the demo store with its own server
        run: |
          nohup npm run demo:serve > demo-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "$LAUNCH_URL/cart.js" > /dev/null && exit 0
            sleep 1
          done
          cat demo-server.log
          exit 1

      - name: Run the test suite
        run: npx cucumber-js

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-server
          path: tests/reports/
          retention-days: 14
          if-no-files-found: ignore
